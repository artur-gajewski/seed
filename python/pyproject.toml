[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-torch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["ruff==0.17.1"]

[project.scripts]
seed-torch = "seed_torch.cli:main"

[tool.ruff]
line-length = 100
